[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libsedmat"
version = "0.1.0"
description = "Zero-dependency Python library for SEDMAT (v3.6/v3.7) rich document annotation and transformation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["sedmat", "sed", "document", "formatting", "dsl"]

[project.urls]
Homepage = "https://sedmat.org"
Repository = "https://github.com/visionik/libsedmat-py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
